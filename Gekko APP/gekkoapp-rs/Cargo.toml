[package]
name = "gekkoapp"
version = "1.1.0"
edition = "2021"
authors = ["The-Gekko"]
description = "GekkoApp - Arch Linux Post-Install & Config Tool"

[features]
default = []
gui = ["dep:tauri", "dep:tauri-build"]

[[bin]]
name = "gekkoapp"
path = "src/main.rs"

[[bin]]
name = "gekkoapp-gui"
path = "src/bin/gekkoapp-gui.rs"
required-features = ["gui"]

[dependencies]
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = ["image-png"], optional = true }
ureq = "3"
zstd = "0.13"

[build-dependencies]
tauri-build = { version = "2", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
